name: macOS Apple Silicon ZIP

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Verify native Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          node -e "if(process.arch !== 'arm64') process.exit(1)"
      - name: Verify release tag
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Validate source
        run: |
          npm run typecheck
          npm run frontend:typecheck
          npm test
      - name: Build arm64 ZIP (ad-hoc signature, not notarized)
        run: npm run release:mac
      - name: Verify bundle and native database
        run: |
          APP="release-build/mac-arm64/RunningHub Runner.app"
          test -f "$APP/Contents/Resources/app.asar"
          file "$APP/Contents/MacOS/RunningHub Runner" | grep arm64
          find "$APP/Contents/Resources/app.asar.unpacked" -name better_sqlite3.node -exec file {} \; | grep arm64
          codesign --verify --deep --strict "$APP"
      - name: Smoke test packaged application
        timeout-minutes: 5
        run: |
          "release-build/mac-arm64/RunningHub Runner.app/Contents/MacOS/RunningHub Runner" --smoke --disable-background-timer-throttling --disable-renderer-backgrounding --disable-backgrounding-occluded-windows
      - name: Checksum
        run: |
          cd release-build
          shasum -a 256 RunningHub-Runner-v*-macos-arm64.zip > SHA256SUMS-macos-arm64.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RunningHub-Runner-macos-arm64
          path: |
            release-build/RunningHub-Runner-v*-macos-arm64.zip
            release-build/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish macOS ARM64 ZIP
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-build/RunningHub-Runner-${{ env.RELEASE_TAG }}-macos-arm64.zip
            release-build/SHA256SUMS-macos-arm64.txt
