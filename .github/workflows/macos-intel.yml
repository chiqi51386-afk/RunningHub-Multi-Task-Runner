name: macOS Intel ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/macos-intel.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Verify native Intel runner
        run: |
          test "$(uname -m)" = x86_64
          node -e "if(process.arch !== 'x64') process.exit(1)"
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Validate source
        run: |
          npm run typecheck
          npm run frontend:typecheck
          npm test
      - name: Build Intel ZIP (ad-hoc signature, not notarized)
        run: npm run release:mac:intel
      - name: Verify bundle and native database
        run: |
          APP="release-build/mac/RunningHub Runner.app"
          test -f "$APP/Contents/Resources/app.asar"
          file "$APP/Contents/MacOS/RunningHub Runner" | grep x86_64
          find "$APP/Contents/Resources/app.asar.unpacked" -name better_sqlite3.node -exec file {} \; | grep x86_64
          codesign --verify --deep --strict "$APP"
      - name: Smoke test packaged application
        timeout-minutes: 5
        run: |
          "release-build/mac/RunningHub Runner.app/Contents/MacOS/RunningHub Runner" --smoke --disable-background-timer-throttling --disable-renderer-backgrounding --disable-backgrounding-occluded-windows
      - name: Checksum
        run: |
          cd release-build
          shasum -a 256 RunningHub-Runner-v*-macos-x64.zip > SHA256SUMS-macos-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RunningHub-Runner-macos-x64
          path: |
            release-build/RunningHub-Runner-v*-macos-x64.zip
            release-build/SHA256SUMS-macos-x64.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
